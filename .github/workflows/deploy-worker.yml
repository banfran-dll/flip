# One-click data server: creates the D1 database if needed, applies migrations,
# deploys the Worker, then records its URL in the site (public/data-server.json)
# and republishes the site so the app finds the server automatically.
#
# Secrets (Settings → Secrets and variables → Actions → Secrets):
#   CLOUDFLARE_API_TOKEN   token with "Workers Scripts: Edit", "D1: Edit", "Account Settings: Read"
#   CLOUDFLARE_ACCOUNT_ID  from the Cloudflare dashboard (Workers & Pages → Overview, right side)
name: Deploy data worker

on:
  push:
    branches: [main]
    paths: ['worker/**']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: worker
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check secrets
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Add the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID repository secrets first (see README → 데이터 서버)."
            exit 1
          fi
      - run: npm ci
        working-directory: worker
      - run: npm test
        working-directory: worker

      - name: Ensure the D1 database exists and pin its id
        id: d1
        working-directory: worker
        run: |
          set -e
          ID=$(npx wrangler d1 list --json | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const l=JSON.parse(s);const d=l.find(x=>x.name==="bzflip");console.log(d?d.uuid:"")})')
          if [ -z "$ID" ]; then
            echo "Creating D1 database bzflip"
            npx wrangler d1 create bzflip > create.log 2>&1 || { cat create.log; exit 1; }
            ID=$(npx wrangler d1 list --json | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const l=JSON.parse(s);const d=l.find(x=>x.name==="bzflip");console.log(d?d.uuid:"")})')
          fi
          [ -n "$ID" ] || { echo "::error::could not determine the D1 database id"; exit 1; }
          sed -i "s/^database_id = \".*\"/database_id = \"$ID\"/" wrangler.toml
          grep database_id wrangler.toml
      - name: Apply migrations
        working-directory: worker
        run: npx wrangler d1 migrations apply bzflip --remote
      - name: Deploy
        id: deploy
        working-directory: worker
        run: |
          set -e
          npx wrangler deploy 2>&1 | tee deploy.log
          URL=$(grep -oE 'https://[a-z0-9.-]+\.workers\.dev' deploy.log | head -1)
          [ -n "$URL" ] || { echo "::error::deploy did not print a workers.dev URL. If this is a new account, open Workers & Pages in the Cloudflare dashboard once to register a workers.dev subdomain, then re-run."; exit 1; }
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "Data server: $URL"
      - name: Smoke test
        run: |
          sleep 5
          curl -sS --fail "${{ steps.deploy.outputs.url }}/v1/status"
          echo

      - name: Record the server URL in the site and pin the database id
        run: |
          mkdir -p public
          printf '{ "url": "%s" }\n' "${{ steps.deploy.outputs.url }}" > public/data-server.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data-server.json worker/wrangler.toml
          git diff --cached --quiet || git commit -m "Record data server URL and D1 database id"
          git push origin HEAD:main

      - name: Rebuild and republish the site with the server URL
        run: |
          npm ci
          npm run build
          touch dist/.nojekyll
          cd dist
          git init -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Deploy site with data server ${{ steps.deploy.outputs.url }}"
          git push --force "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
        env:
          VITE_DATA_URL: ${{ steps.deploy.outputs.url }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
